<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    h3 { margin: 0 0 4px 0; font-size: 15px; color: #38bdf8; font-weight: 700; }
    p { font-size: 12px; color: #94a3b8; margin: 0 0 14px 0; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
    }
    input[type="checkbox"] {
      cursor: pointer;
      width: 16px;
      height: 16px;
      accent-color: #0284c7;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
    <img src="icons/icon128.png" style="width: 32px; height: 32px; border-radius: 8px; border: 1px solid rgba(56, 189, 248, 0.4);" alt="Logo">
    <div>
      <h3 style="margin: 0; line-height: 1.1;">Vanya Downloader</h3>
      <p style="margin: 2px 0 0 0; font-size: 11px;">IDM-Style Browser Extension</p>
    </div>
  </div>

  <div class="card">
    <div class="status">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Connected to Desktop App</span>
    </div>
  </div>

  <div class="card">
    <div class="toggle-row">
      <span>Auto-Intercept Downloads</span>
      <input type="checkbox" id="interceptToggle" checked>
    </div>
  </div>

  <script>
    const toggle = document.getElementById('interceptToggle');
    chrome.storage.local.get(['autoIntercept'], (res) => {
      toggle.checked = res.autoIntercept !== false;
    });

    toggle.addEventListener('change', () => {
      chrome.storage.local.set({ autoIntercept: toggle.checked });
    });

    fetch("http://127.0.0.1:18792/add-download", { method: "OPTIONS" })
      .catch(() => {
        document.getElementById('statusDot').style.background = '#ef4444';
        document.getElementById('statusDot').style.boxShadow = 'none';
        document.getElementById('statusText').innerText = 'Desktop App Not Running';
      });
  </script>
</body>
</html>
